function mkpath(d, cls){
  var p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d); p.setAttribute('class', cls);

}

function drawNew(){
  linkG.innerHTML = '';

  SLINKS.forEach(function(s){
    var a = POS[s.a], b = POS[s.b];
    if (a.x > b.x) { var t=a; a=b; b=t; }
    mkpath('M '+(a.x+CW)+' '+(a.y+CH/2)+' L '+(b.x)+' '+(b.y+CH/2), 'sp');
  });
  // child links: single line to couple midpoint, orthogonal elbows with rounded corners
  CLINKS.forEach(function(L){
    var ch = POS[L.child];

    var p2 = POS[L.parents[1]] || p1;
    var mx = (p1.x + p2.x) / 2 + CW/2;
    var py = Math.max(p1.y, p2.y) + CH;
    var cy = ch.y;
    // vertical drop from couple
    mkpath('M '+mx+' '+py+' L '+mx+' '+(py+30), 'lk');
    // bus across to child x
    var midY = py + 45;
    mkpath('M '+mx+' '+(py+30)+' Q '+mx+' '+midY+' '+(mx + (ch.x+CW/2 > mx ? 8 : -8))+' '+midY+

    mkpath('M '+(a.x+CW)+' '+(a.y+CH/2)+' L '+(b.x)+' '+(b.y+CH/2), 'sp');

  // separate diagonal from child to each parent card
  CLINKS.forEach(function(L){
    var ch = POS[L.child];
    L.parents.forEach(function(pid){

      var p = POS[pid];
      mkpath('M '+(ch.x+CW/2)+' '+ch.y+' L '+(p.x+CW/2)+' '+(p.y+CH), 'lk');
    });
  });
}
