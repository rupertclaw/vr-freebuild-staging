<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR Grid Layout Prototype</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #2a1f1a; color: #e0d6c8; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
#controls { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #1a1410; padding: 8px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #4a3a2a; }
#controls label { font-size: 13px; color: #a09080; }
#controls button { background: #3a2a1a; color: #e0d6c8; border: 1px solid #5a4a3a; padding: 4px 12px; cursor: pointer; border-radius: 3px; font-size: 13px; }
#controls button:hover { background: #4a3a2a; }
#controls select { background: #1a1410; color: #e0d6c8; border: 1px solid #5a4a3a; padding: 3px 8px; font-size: 13px; border-radius: 3px; }
#controls input { background: #1a1410; color: #e0d6c8; border: 1px solid #5a4a3a; padding: 3px 8px; font-size: 13px; border-radius: 3px; width: 60px; }
#treeContainer { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; overflow: auto; background: #f5f0e6; }
#treeSvg { position: absolute; top: 0; left: 0; }
.card { position: absolute; width: 140px; height: 50px; background: #fff; border: 1px solid #ccc; border-left: 3px solid #8b7355; border-radius: 3px; padding: 4px 6px; font-size: 11px; color: #333; cursor: pointer; overflow: hidden; transition: box-shadow 0.15s; z-index: 2; }
.card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 10; }
.card.male { border-left-color: #4a7ab0; }
.card.female { border-left-color: #b04a7a; }
.card.unknown { border-left-color: #8b7355; }
.card.anchor { border: 2px solid #d4a017; box-shadow: 0 0 8px rgba(212,160,23,0.4); }
.card-name { font-weight: bold; font-size: 11px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-dates { font-size: 10px; color: #888; line-height: 1.2; margin-top: 2px; }
.card-gen { font-size: 8px; color: #aaa; position: absolute; bottom: 2px; right: 4px; }
.gen-label { position: absolute; left: 4px; font-size: 10px; color: #999; font-style: italic; z-index: 1; background: #f5f0e6; padding: 0 4px; border-radius: 2px; }
</style>
</head>
<body>

<div id="controls">
  <label>Anchor:</label>
  <select id="anchorSelect"></select>
  <label>Card W:</label>
  <input id="cardW" type="number" value="140">
  <label>Card H:</label>
  <input id="cardH" type="number" value="50">
  <label>Gap X:</label>
  <input id="gapX" type="number" value="30">
  <label>Gap Y:</label>
  <input id="gapY" type="number" value="80">
  <button id="layoutBtn">Layout</button>
  <button id="fitBtn">Fit</button>
  <button id="loadGedBtn">Load GED</button>
  <input id="gedFile" type="file" accept=".ged" style="display:none">
  <span id="stats"></span>
</div>

<div id="treeContainer">
  <div id="treeSvg"></div>
</div>

<script>
// ============================================================
// VR GRID LAYOUT PROTOTYPE
// Fixed grid placement: gen = row, family-grouped slots = col
// No collision detection, no post-placement shifting
// ============================================================

let DATA = null;
let ANCHOR_ID = 'I126'; // John Penhallow Harrow

// ---- GED parser ----
function parseGed(text) {
  const individuals = {};
  const families = {};
  
  // Split into records
  const lines = text.split(/\r?\n/);
  let currentRecord = null;
  let currentId = null;
  let currentType = null;
  let currentBody = [];
  let inBirt = false, inDeat = false, inMarr = false;
  let birthDate = '', deathDate = '', marrDate = '';
  
  function flushRecord() {
    if (!currentId || !currentType) return;
    if (currentType === 'INDI') {
      const nameLine = currentBody.find(l => l.startsWith('1 NAME '));
      const sexLine = currentBody.find(l => l.startsWith('1 SEX '));
      individuals[currentId] = {
        id: currentId,
        name: nameLine ? nameLine.substring(7).trim() : 'Unknown',
        sex: sexLine ? sexLine.substring(7).trim() : '?',
        birth: birthDate,
        death: deathDate,
        fams: currentBody.filter(l => l.startsWith('1 FAMS ')).map(l => l.match(/@(\w+)@/)?.[1]).filter(Boolean),
        famc: currentBody.filter(l => l.startsWith('1 FAMC ')).map(l => l.match(/@(\w+)@/)?.[1]).filter(Boolean)
      };
    } else if (currentType === 'FAM') {
      const husbLine = currentBody.find(l => l.startsWith('1 HUSB '));
      const wifeLine = currentBody.find(l => l.startsWith('1 WIFE '));
      const chilLines = currentBody.filter(l => l.startsWith('1 CHIL '));
      families[currentId] = {
        id: currentId,
        husb: husbLine ? husbLine.match(/@(\w+)@/)?.[1] : null,
        wife: wifeLine ? wifeLine.match(/@(\w+)@/)?.[1] : null,
        children: chilLines.map(l => l.match(/@(\w+)@/)?.[1]).filter(Boolean),
        marr: marrDate
      };
    }
  }
  
  for (let line of lines) {
    if (line.startsWith('0 @') && line.includes(' INDI')) {
      flushRecord();
      currentId = line.match(/@(\w+)@/)?.[1];
      currentType = 'INDI';
      currentBody = [];
      birthDate = ''; deathDate = '';
      inBirt = false; inDeat = false;
    } else if (line.startsWith('0 @') && line.includes(' FAM')) {
      flushRecord();
      currentId = line.match(/@(\w+)@/)?.[1];
      currentType = 'FAM';
      currentBody = [];
      marrDate = '';
      inMarr = false;
    } else if (line.startsWith('0 ')) {
      flushRecord();
      currentId = null; currentType = null;
    } else if (currentId) {
      currentBody.push(line);
      if (line.startsWith('1 BIRT')) { inBirt = true; }
      else if (line.startsWith('1 DEAT')) { inDeat = true; }
      else if (line.startsWith('1 MARR')) { inMarr = true; }
      else if (line.startsWith('2 DATE ') && inBirt) { birthDate = line.substring(7).trim(); }
      else if (line.startsWith('2 DATE ') && inDeat) { deathDate = line.substring(7).trim(); }
      else if (line.startsWith('2 DATE ') && inMarr) { marrDate = line.substring(7).trim(); }
      else if (line.startsWith('1 ') && !line.startsWith('1 BIRT') && !line.startsWith('1 DEAT') && !line.startsWith('1 MARR')) { inBirt = false; inDeat = false; inMarr = false; }
    }
  }
  flushRecord();
  
  return { individuals, families };
}

// ---- Build child->family map ----
function buildChildToFamily(families) {
  const map = {};
  for (const fid in families) {
    for (const childId of families[fid].children) {
      map[childId] = fid;
    }
  }
  return map;
}

// ---- BFS generation assignment ----
function assignGenerations(individuals, families, childToFamily, anchorId) {
  const generations = {};
  const visited = new Set();
  const queue = [anchorId];
  generations[anchorId] = 0;
  
  while (queue.length > 0) {
    const pid = queue.shift();
    if (visited.has(pid)) continue;
    visited.add(pid);
    const gen = generations[pid];
    
    // Find spouse families
    for (const fid in families) {
      const fam = families[fid];
      if (fam.husb === pid || fam.wife === pid) {
        const spouse = fam.husb === pid ? fam.wife : fam.husb;
        if (spouse && !visited.has(spouse) && generations[spouse] === undefined) {
          generations[spouse] = gen;
          queue.push(spouse);
        }
        for (const childId of fam.children) {
          if (!visited.has(childId) && generations[childId] === undefined) {
            generations[childId] = gen + 1;
            queue.push(childId);
          }
        }
      }
    }
    
    // Find parent family
    const parentFamId = childToFamily[pid];
    if (parentFamId) {
      const fam = families[parentFamId];
      for (const parentId of [fam.husb, fam.wife]) {
        if (parentId && !visited.has(parentId) && generations[parentId] === undefined) {
          generations[parentId] = gen - 1;
          queue.push(parentId);
        }
      }
      // Siblings
      for (const sibId of fam.children) {
        if (sibId !== pid && !visited.has(sibId) && generations[sibId] === undefined) {
          generations[sibId] = gen;
          queue.push(sibId);
        }
      }
    }
  }
  
  return { generations, visited };
}

// ---- Find disconnected components ----
function findDisconnected(individuals, families, visited) {
  const all = new Set(Object.keys(individuals));
  const disconnected = [...all].filter(id => !visited.has(id));
  const alreadyGrouped = new Set();
  const components = [];
  
  for (const pid of disconnected) {
    if (alreadyGrouped.has(pid)) continue;
    const comp = new Set();
    const queue = [pid];
    while (queue.length > 0) {
      const p = queue.shift();
      if (comp.has(p)) continue;
      comp.add(p);
      alreadyGrouped.add(p);
      
      for (const fid in families) {
        const fam = families[fid];
        if (fam.husb === p || fam.wife === p) {
          const spouse = fam.husb === p ? fam.wife : fam.husb;
          if (spouse && disconnected.includes(spouse) && !comp.has(spouse)) queue.push(spouse);
          for (const c of fam.children) {
            if (disconnected.includes(c) && !comp.has(c)) queue.push(c);
          }
        }
        if (fam.children.includes(p)) {
          for (const parent of [fam.husb, fam.wife]) {
            if (parent && disconnected.includes(parent) && !comp.has(parent)) queue.push(parent);
          }
          for (const sib of fam.children) {
            if (sib !== p && disconnected.includes(sib) && !comp.has(sib)) queue.push(sib);
          }
        }
      }
    }
    components.push([...comp]);
  }
  
  return components;
}

// ---- Family-grouped slot assignment ----
// For each generation row, assign column slots ordered by family grouping:
// 1. Start with anchor (gen 0) at center
// 2. Walk outward: spouses adjacent, children centered under parents, siblings grouped
function assignSlots(individuals, families, childToFamily, generations, visited, anchorId) {
  const CARD_W = parseInt(document.getElementById('cardW').value);
  const CARD_H = parseInt(document.getElementById('cardH').value);
  const GAP_X = parseInt(document.getElementById('gapX').value);
  const GAP_Y = parseInt(document.getElementById('gapY').value);
  
  const STEP_X = CARD_W + GAP_X;
  const STEP_Y = CARD_H + GAP_Y;
  
  // Group people by generation
  const byGen = {};
  for (const [pid, gen] of Object.entries(generations)) {
    if (!byGen[gen]) byGen[gen] = [];
    byGen[gen].push(pid);
  }
  
  // For each generation, we need to order people by family groups
  // Strategy: process families in order, place couples together, children under parents
  
  // Build a family ordering for each generation
  // Start from anchor and work outward
  
  const positions = {}; // pid -> { x, y }
  
  // First, figure out which families belong to which generation
  // A family "belongs" to the generation of the parents
  
  // For each person, find their spouse family(s) and parent family
  const personSpouseFams = {}; // pid -> [famId]
  const personParentFam = {};   // pid -> famId
  
  for (const fid in families) {
    const fam = families[fid];
    if (fam.husb) {
      if (!personSpouseFams[fam.husb]) personSpouseFams[fam.husb] = [];
      personSpouseFams[fam.husb].push(fid);
    }
    if (fam.wife) {
      if (!personSpouseFams[fam.wife]) personSpouseFams[fam.wife] = [];
      personSpouseFams[fam.wife].push(fid);
    }
    for (const childId of fam.children) {
      personParentFam[childId] = fid;
    }
  }
  
  // Process each generation from anchor outward
  const genList = Object.keys(byGen).map(Number).sort((a, b) => a - b);
  
  // For gen 0: place anchor at center, then spouses, siblings around
  // For gen -1 (parents): place anchor's parents above, then their siblings
  // For gen +1 (children): place children below
  
  // Track which column each family group occupies
  let nextCol = 0; // running counter for slot assignment
  const colMap = {}; // pid -> col (can be fractional for couples)
  
  // Process from anchor generation outward (both directions)
  // Start with gen 0
  const anchorGen = 0;
  
  // Place anchor at col 0
  colMap[anchorId] = 0;
  
  // Place anchor's spouses next to anchor
  const anchorSpouseFams = personSpouseFams[anchorId] || [];
  let anchorCol = 0;
  for (const fid of anchorSpouseFams) {
    const fam = families[fid];
    const spouse = fam.husb === anchorId ? fam.wife : fam.husb;
    if (spouse && visited.has(spouse)) {
      // Place spouse to the right of anchor
      anchorCol += 1;
      colMap[spouse] = anchorCol;
    }
    // Place children below this couple
    const coupleCenter = (colMap[anchorId] + colMap[spouse]) / 2;
    let childOffset = 0;
    for (const childId of fam.children) {
      if (visited.has(childId)) {
        colMap[childId] = coupleCenter + childOffset - (fam.children.length - 1) / 2;
        childOffset++;
      }
    }
  }
  
  // Now process other generations
  // For each generation, order people by their family connections
  
  function orderGeneration(gen) {
    const people = byGen[gen] || [];
    if (!people.length) return;
    
    // Group people by their parent family
    const familyGroups = {}; // parentFamId -> [pid]
    const ungrouped = [];
    
    for (const pid of people) {
      const parentFamId = personParentFam[pid];
      if (parentFamId) {
        if (!familyGroups[parentFamId]) familyGroups[parentFamId] = [];
        familyGroups[parentFamId].push(pid);
      } else {
        ungrouped.push(pid);
      }
    }
    
    // Order family groups by the column of their children in the previous generation
    // (or by the column of parents in the next generation for ancestor gens)
    const orderedGroups = Object.entries(familyGroups).sort((a, b) => {
      // Find the avg column of people in this group from adjacent generation
      const getAvgCol = (groupPids) => {
        const cols = groupPids.map(pid => colMap[pid]).filter(c => c !== undefined);
        return cols.length ? cols.reduce((s, c) => s + c, 0) / cols.length : 999;
      };
      return getAvgCol(a[1]) - getAvgCol(b[1]);
    });
    
    // For ancestor generations (gen < 0), order by children's columns
    // For descendant generations (gen > 0), order by parents' columns
    if (gen < 0) {
      // These are ancestors. For each person, find their children (in gen+1) and center above them
      for (const pid of people) {
        if (colMap[pid] !== undefined) continue;
        
        // Find families where this person is a parent
        const spouseFams = personSpouseFams[pid] || [];
        let childColSum = 0, childCount = 0;
        
        for (const fid of spouseFams) {
          const fam = families[fid];
          for (const childId of fam.children) {
            if (colMap[childId] !== undefined) {
              childColSum += colMap[childId];
              childCount++;
            }
          }
        }
        
        if (childCount > 0) {
          colMap[pid] = childColSum / childCount;
        }
      }
      
      // Place spouses next to each other
      for (const pid of people) {
        if (colMap[pid] !== undefined) continue;
        const spouseFams = personSpouseFams[pid] || [];
        for (const fid of spouseFams) {
          const fam = families[fid];
          const spouse = fam.husb === pid ? fam.wife : fam.husb;
          if (spouse && colMap[spouse] !== undefined) {
            colMap[pid] = colMap[spouse] + (fam.husb === pid ? 1 : -1);
          }
        }
      }
      
      // Any remaining unplaced people get sequential slots
      for (const pid of people) {
        if (colMap[pid] === undefined) {
          colMap[pid] = nextCol++;
        }
      }
    } else if (gen > 0) {
      // Descendants: center children under parents
      for (const pid of people) {
        if (colMap[pid] !== undefined) continue;
        
        const parentFamId = personParentFam[pid];
        if (parentFamId) {
          const fam = families[parentFamId];
          const parents = [fam.husb, fam.wife].filter(p => p && colMap[p] !== undefined);
          if (parents.length > 0) {
            const parentCenter = parents.reduce((s, p) => s + colMap[p], 0) / parents.length;
            // Get all siblings in this family that are in this gen
            const siblings = fam.children.filter(c => generations[c] === gen && visited.has(c));
            const sibIndex = siblings.indexOf(pid);
            const totalSibs = siblings.length;
            colMap[pid] = parentCenter + (sibIndex - (totalSibs - 1) / 2);
          }
        }
      }
      
      // Place spouses next to placed people
      for (const pid of people) {
        if (colMap[pid] !== undefined) continue;
        const spouseFams = personSpouseFams[pid] || [];
        for (const fid of spouseFams) {
          const fam = families[fid];
          const spouse = fam.husb === pid ? fam.wife : fam.husb;
          if (spouse && colMap[spouse] !== undefined && visited.has(spouse)) {
            colMap[pid] = colMap[spouse] + 1;
          }
        }
      }
      
      for (const pid of people) {
        if (colMap[pid] === undefined) {
          colMap[pid] = nextCol++;
        }
      }
    }
    
    // Round to avoid overlaps from fractional positions
    // Resolve overlaps: if two people have same col, shift one right
    const occupied = {};
    for (const pid of people) {
      let col = colMap[pid];
      // Snap to nearest 0.5
      col = Math.round(col * 2) / 2;
      // Check for overlap
      while (occupied[col] !== undefined) {
        col += 0.5;
      }
      occupied[col] = pid;
      colMap[pid] = col;
    }
  }
  
  // Process generations from anchor outward
  // First gen 0 (already partially placed), then expand outward
  for (const gen of genList) {
    if (gen === 0) continue; // skip anchor gen, already handled
    orderGeneration(gen);
  }
  
  // Re-process gen 0 to clean up any unplaced
  orderGeneration(0);
  
  // Convert col+gen to pixel positions
  // Normalize so minimum col = 0 and minimum gen = 0
  const allCols = Object.values(colMap).filter(c => c !== undefined);
  const minCol = Math.min(...allCols);
  const minGen = Math.min(...genList);
  
  for (const pid in colMap) {
    if (!visited.has(pid)) continue;
    const normCol = colMap[pid] - minCol;
    const normGen = generations[pid] - minGen;
    positions[pid] = {
      x: normCol * STEP_X + 20,
      y: normGen * STEP_Y + 20
    };
  }
  
  return positions;
}

// ---- Build connections from final positions ----
function buildConnections(individuals, families, positions, visited) {
  const connections = [];
  
  for (const fid in families) {
    const fam = families[fid];
    const husbPos = fam.husb ? positions[fam.husb] : null;
    const wifePos = fam.wife ? positions[fam.wife] : null;
    
    // Marriage line: horizontal between spouses
    if (husbPos && wifePos && visited.has(fam.husb) && visited.has(fam.wife)) {
      connections.push({
        type: 'marriage',
        x1: husbPos.x, y1: husbPos.y,
        x2: wifePos.x, y2: wifePos.y,
        husbId: fam.husb, wifeId: fam.wife
      });
    }
    
    // Parent-child: from couple midpoint (or single parent) down to each child
    const placedChildren = fam.children.filter(c => positions[c] && visited.has(c));
    if (placedChildren.length === 0) continue;
    
    let parentMidX, parentY;
    if (husbPos && wifePos) {
      parentMidX = (husbPos.x + wifePos.x) / 2;
      parentY = (husbPos.y + wifePos.y) / 2;
    } else if (husbPos) {
      parentMidX = husbPos.x + 70; // half card width
      parentY = husbPos.y;
    } else if (wifePos) {
      parentMidX = wifePos.x + 70;
      parentY = wifePos.y;
    } else {
      continue; // no parents placed
    }
    
    // One bus connector per family
    connections.push({
      type: 'parent-child-bus',
      parentMidX: parentMidX,
      parentY: parentY,
      children: placedChildren.map(cid => ({
        childId: cid,
        childX: positions[cid].x + 70, // center of card
        childY: positions[cid].y
      }))
    });
  }
  
  return connections;
}

// ---- Render ----
function render(individuals, generations, positions, connections, visited, anchorId) {
  const CARD_W = parseInt(document.getElementById('cardW').value);
  const CARD_H = parseInt(document.getElementById('cardH').value);
  const container = document.getElementById('treeContainer');
  const svgLayer = document.getElementById('treeSvg');
  
  // Clear
  container.querySelectorAll('.card, .gen-label, svg').forEach(el => el.remove());
  
  // Calculate bounds
  const allX = Object.values(positions).map(p => p.x);
  const allY = Object.values(positions).map(p => p.y);
  const maxX = Math.max(...allX) + CARD_W + 50;
  const maxY = Math.max(...allY) + CARD_H + 50;
  
  // Create SVG for connections
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', maxX);
  svg.setAttribute('height', maxY);
  svg.style.position = 'absolute';
  svg.style.top = '0';
  svg.style.left = '0';
  svg.style.pointerEvents = 'none';
  svg.style.zIndex = '1';
  
  // Draw connections
  for (const conn of connections) {
    if (conn.type === 'marriage') {
      // Horizontal line between spouse cards (at card center height)
      const y = conn.y1 + 25; // center of card
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', conn.x1 + (conn.x2 > conn.x1 ? CARD_W : 0));
      line.setAttribute('y1', y);
      line.setAttribute('x2', conn.x2 + (conn.x2 > conn.x1 ? 0 : CARD_W));
      line.setAttribute('y2', y);
      line.setAttribute('stroke', '#999');
      line.setAttribute('stroke-width', 1.5);
      svg.appendChild(line);
    } else if (conn.type === 'parent-child-bus') {
      const busY = (conn.parentY + conn.children[0].childY) / 2;
      
      // Vertical from parent midpoint down to bus
      const v1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      v1.setAttribute('x1', conn.parentMidX);
      v1.setAttribute('y1', conn.parentY + CARD_H);
      v1.setAttribute('x2', conn.parentMidX);
      v1.setAttribute('y2', busY);
      v1.setAttribute('stroke', '#999');
      v1.setAttribute('stroke-width', 1.5);
      svg.appendChild(v1);
      
      // Horizontal bus from leftmost to rightmost child
      const minChildX = Math.min(...conn.children.map(c => c.childX));
      const maxChildX = Math.max(...conn.children.map(c => c.childX));
      if (conn.children.length > 1) {
        const hBus = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        hBus.setAttribute('x1', Math.min(minChildX, conn.parentMidX));
        hBus.setAttribute('y1', busY);
        hBus.setAttribute('x2', Math.max(maxChildX, conn.parentMidX));
        hBus.setAttribute('y2', busY);
        hBus.setAttribute('stroke', '#999');
        hBus.setAttribute('stroke-width', 1.5);
        svg.appendChild(hBus);
      }
      
      // Vertical from bus down to each child
      for (const child of conn.children) {
        const vChild = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        vChild.setAttribute('x1', child.childX);
        vChild.setAttribute('y1', busY);
        vChild.setAttribute('x2', child.childX);
        vChild.setAttribute('y2', child.childY);
        vChild.setAttribute('stroke', '#999');
        vChild.setAttribute('stroke-width', 1.5);
        svg.appendChild(vChild);
      }
    }
  }
  
  svgLayer.appendChild(svg);
  
  // Draw cards
  for (const pid in positions) {
    if (!visited.has(pid)) continue;
    const pos = positions[pid];
    const person = individuals[pid];
    if (!person) continue;
    
    const card = document.createElement('div');
    card.className = 'card ' + (person.sex === 'M' ? 'male' : person.sex === 'F' ? 'female' : 'unknown');
    if (pid === anchorId) card.classList.add('anchor');
    card.style.left = pos.x + 'px';
    card.style.top = pos.y + 'px';
    
    // Clean up name (remove slashes from GEDCOM format)
    const cleanName = person.name.replace(/\//g, '').trim();
    const dates = (person.birth || '') + (person.birth && person.death ? ' - ' : '') + (person.death || '');
    
    card.innerHTML = `
      <div class="card-name">${cleanName}</div>
      <div class="card-dates">${dates || '?'}</div>
      <div class="card-gen">G${generations[pid]}</div>
    `;
    
    card.title = `${cleanName}\n${dates}\nID: ${pid}\nGen: ${generations[pid]}`;
    container.appendChild(card);
  }
  
  // Draw generation labels
  const genSet = new Set(Object.values(generations));
  const minGen = Math.min(...genSet);
  const STEP_Y = parseInt(document.getElementById('cardH').value) + parseInt(document.getElementById('gapY').value);
  for (const gen of genSet) {
    const normGen = gen - minGen;
    const label = document.createElement('div');
    label.className = 'gen-label';
    label.style.top = (normGen * STEP_Y + 35) + 'px';
    label.textContent = gen === 0 ? 'Anchor' : gen < 0 ? `Gen ${gen}` : `Gen +${gen}`;
    container.appendChild(label);
  }
  
  // Update stats
  const stats = document.getElementById('stats');
  stats.textContent = ` | ${visited.size} people, ${connections.length} connections | Canvas: ${maxX}x${maxY}`;
  
  // Store for fit function
  window._treeBounds = { maxX, maxY };
}

// ---- Fit to screen ----
function fitToScreen() {
  const container = document.getElementById('treeContainer');
  const bounds = window._treeBounds;
  if (!bounds) return;
  
  const cw = container.clientWidth - 40;
  const ch = container.clientHeight - 40;
  const scale = Math.min(cw / bounds.maxX, ch / bounds.maxY, 1);
  
  const svgLayer = document.getElementById('treeSvg');
  const content = container.querySelectorAll('.card, .gen-label, svg');
  
  // Apply transform via CSS zoom
  container.style.transformOrigin = '0 0';
  container.style.transform = `scale(${scale})`;
  
  // Adjust container scroll area
  const scaledW = bounds.maxX * scale;
  const scaledH = bounds.maxY * scale;
  svgLayer.style.width = scaledW + 'px';
  svgLayer.style.height = scaledH + 'px';
}

// ---- Main layout function ----
function doLayout() {
  if (!DATA) return;
  
  const { individuals, families } = DATA;
  const childToFamily = buildChildToFamily(families);
  const { generations, visited } = assignGenerations(individuals, families, childToFamily, ANCHOR_ID);
  const positions = assignSlots(individuals, families, childToFamily, generations, visited, ANCHOR_ID);
  const connections = buildConnections(individuals, families, positions, visited);
  
  render(individuals, generations, positions, connections, visited, ANCHOR_ID);
}

// ---- Load default GED data ----
function loadDefaultGed() {
  // Use embedded TREE_DATA from tree-data.js
  DATA = {
    individuals: EMBEDDED_DATA.individuals,
    families: EMBEDDED_DATA.families
  };
  
  // Populate anchor select with some known people
  const select = document.getElementById('anchorSelect');
  select.innerHTML = '';
  const anchorCandidates = ['I126', 'I122', 'I399', 'I300', 'I488', 'I472'];
  for (const pid of anchorCandidates) {
    if (DATA.individuals[pid]) {
      const opt = document.createElement('option');
      opt.value = pid;
      opt.textContent = DATA.individuals[pid].name.replace(/\//g, '').trim() + ' (b.' + (DATA.individuals[pid].birth || '?') + ')';
      select.appendChild(opt);
    }
  }
  select.value = ANCHOR_ID;
  
  doLayout();
}

// ---- Event handlers ----
document.getElementById('layoutBtn').addEventListener('click', doLayout);
document.getElementById('fitBtn').addEventListener('click', fitToScreen);
document.getElementById('anchorSelect').addEventListener('change', (e) => {
  ANCHOR_ID = e.target.value;
  doLayout();
});

['cardW', 'cardH', 'gapX', 'gapY'].forEach(id => {
  document.getElementById(id).addEventListener('change', doLayout);
});

document.getElementById('loadGedBtn').addEventListener('click', () => {
  document.getElementById('gedFile').click();
});

document.getElementById('gedFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  DATA = parseGed(text);
  
  // Find people born 1960-1970 as anchor candidates
  const select = document.getElementById('anchorSelect');
  select.innerHTML = '';
  const candidates = Object.values(DATA.individuals)
    .filter(p => {
      const y = parseInt((p.birth || '').match(/\d{4}/)?.[0] || 0);
      return y >= 1955 && y <= 1975;
    })
    .sort((a, b) => (a.birth || '').localeCompare(b.birth || ''));
  
  for (const person of candidates.slice(0, 20)) {
    const opt = document.createElement('option');
    opt.value = person.id;
    opt.textContent = person.name.replace(/\//g, '').trim() + ' (b.' + (person.birth || '?') + ')';
    select.appendChild(opt);
  }
  
  // Default to I126 if available
  if (DATA.individuals['I126']) {
    ANCHOR_ID = 'I126';
    select.value = ANCHOR_ID;
  } else if (candidates.length > 0) {
    ANCHOR_ID = candidates[0].id;
    select.value = ANCHOR_ID;
  }
  
  doLayout();
});

// ---- Init ----
loadDefaultGed();
</script>
